# Builds the Shiny app as a "Shinylive" website (R runs in the browser, no server needed)
# and publishes it via GitHub Pages.
name: Publish Shiny app as website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("shiny", "shinylive"))'

      - name: Fetch IntCal20 curve (if not in the repository)
        run: |
          if [ ! -f app/intcal20.14c ]; then
            curl -fsSL -o app/intcal20.14c https://intcal.org/curves/intcal20.14c
          fi
          head -n 5 app/intcal20.14c

      - name: Export Shinylive
        run: Rscript -e 'shinylive::export("app", "site")'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
